name: Documentation check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.5
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run --locked python scripts/build-docs.py
      - run: uv run --locked python scripts/test-build-docs.py
